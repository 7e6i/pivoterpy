[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pivoterpy"
version = "0.1.3"
description = "Pure Python implementation of Pivoter clique counting algorithm."
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
dev = [
    "pytest>=7.0",
    "build",
    "twine",
]