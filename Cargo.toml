[package]
name = "pivoterpy"
version = "2.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/7e6i/pivoterpy"
description = "Exact clique counting in Python and Rust (Pivoter)."

[lib]
name = "pivoter_rust" 
crate-type = ["cdylib"]

[features]
default = []
# Enable to compile `src/cuda/pivoter.cu` (requires nvcc + CUDA toolkit). CI uses default only.
cuda = []

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module", "generate-import-lib", "abi3-py38", "num-bigint"] }
rayon = "1.12"
fixedbitset = "0.5"
num-bigint = "0.4"
num-traits = "0.2"

[build-dependencies]
cc = "1.0"